<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Jarvis Overlay</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent;
            font-family: Arial, sans-serif;
        }

        .panel {
            width: 350px;
            height: 180px;

            background: rgba(12, 18, 28, 0.96);

            border: 1px solid rgba(0, 174, 255, 0.35);

            border-radius: 20px;

            box-shadow:
                0 0 20px rgba(0, 140, 255, 0.25),
                0 10px 40px rgba(0, 0, 0, 0.45);

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            color: white;
        }

        .orb {
            width: 55px;
            height: 55px;

            border-radius: 50%;

            background: radial-gradient(
                circle at 35% 30%,
                #ffffff,
                #63d9ff 20%,
                #008cff 55%,
                #004cff 85%
            );

            box-shadow:
                0 0 15px #00aaff,
                0 0 35px #008cff,
                0 0 60px rgba(0, 100, 255, 0.8);

            animation: pulse 2s infinite ease-in-out;
        }

        @keyframes pulse {

            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.1);
            }

            100% {
                transform: scale(1);
            }
        }

        .title {
            margin-top: 12px;

            font-size: 18px;
            font-weight: bold;

            letter-spacing: 4px;
        }

        .status {
            margin-top: 6px;

            font-size: 13px;

            color: #7fdcff;
        }
    </style>
</head>

<body>

    <div class="panel">

        <div class="orb"></div>

        <div class="title">
           JARVIS
        </div>

    <div id="status" class="status">
             Idle
    </div>

    </div>
    <script>
    const { ipcRenderer } = require("electron");

    ipcRenderer.on("update-status", (event, status) => {
        document.getElementById("status").innerText = status;
    });
</script>

</body>

</html>
